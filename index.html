<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <meta
        name="theme-color"
        content="#080606"
    >

    <title>GABOBARS</title>


    <!-- Fonts -->

    <link
        rel="preconnect"
        href="https://fonts.googleapis.com"
    >

    <link
        rel="preconnect"
        href="https://fonts.gstatic.com"
        crossorigin
    >

    <link
        href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=IM+Fell+English+SC&family=JetBrains+Mono:wght@400;500&display=swap"
        rel="stylesheet"
    >


    <!-- Main CSS -->

    <link
        rel="stylesheet"
        href="style.css"
    >

</head>


<body>


    <!-- =====================================================
         BACKGROUND
    ====================================================== -->

    <div
        class="background-layer"
        aria-hidden="true"
    >

        <img
            id="backgroundImage"
            src="assets/images/background.jpg"
            alt=""
        >

    </div>



    <!-- =====================================================
         DECORATIVE LAYER
         
         Scrolls with the page.
    ====================================================== -->

    <div
        class="site-decor"
        aria-hidden="true"
    >


        <!-- =========================
             GHOST
        ========================== -->

        <div
            class="decor-item decor-ghost"
        >

            <div
                class="tenor-gif-embed"
                data-postid="21517797"
                data-share-method="host"
                data-aspect-ratio="1.77822"
                data-width="100%"
            ></div>

        </div>



        <!-- =========================
             OUTLAST #1
        ========================== -->

        <div
            class="decor-item decor-outlast-one"
        >

            <div
                class="tenor-gif-embed"
                data-postid="9281273"
                data-share-method="host"
                data-aspect-ratio="1.79137"
                data-width="100%"
            ></div>

        </div>



        <!-- =========================
             OUTLAST #2
        ========================== -->

        <div
            class="decor-item decor-outlast-two"
        >

            <div
                class="tenor-gif-embed"
                data-postid="27080514"
                data-share-method="host"
                data-aspect-ratio="1"
                data-width="100%"
            ></div>

        </div>



        <!-- =========================
             KURUMI #1
        ========================== -->

        <div
            class="decor-item decor-kurumi-one"
        >

            <div
                class="tenor-gif-embed"
                data-postid="21175060"
                data-share-method="host"
                data-aspect-ratio="1.77822"
                data-width="100%"
            ></div>

        </div>



        <!-- =========================
             KURUMI #2
        ========================== -->

        <div
            class="decor-item decor-kurumi-two"
        >

            <div
                class="tenor-gif-embed"
                data-postid="17435845"
                data-share-method="host"
                data-aspect-ratio="1.77822"
                data-width="100%"
            ></div>

        </div>



        <!-- =========================
             SMALL STICKERS
        ========================== -->

        <div class="decor-sticker sticker-online">
            ONLINE
        </div>


        <div class="decor-sticker sticker-94">
            LEVEL 94
        </div>


        <div class="decor-sticker sticker-live">
            LIVE
        </div>


        <div class="decor-sticker sticker-red">
            //
        </div>


        <div class="decor-sticker sticker-eye">
            ◉
        </div>



        <!-- =========================
             SMALL MARKS
        ========================== -->

        <div class="decor-mark mark-one">
            ///
        </div>


        <div class="decor-mark mark-two">
            01
        </div>


        <div class="decor-mark mark-three">
            +
        </div>


        <div class="decor-mark mark-four">
            94
        </div>

    </div>



    <!-- =====================================================
         MAIN SITE
    ====================================================== -->

    <main class="site-shell">


        <section class="site-panel">


            <!-- Panel shadows -->

            <div
                class="panel-shadow panel-shadow-top"
            ></div>


            <div
                class="panel-shadow panel-shadow-bottom"
            ></div>



            <!-- =================================================
                 HERO
            ================================================== -->

            <header class="hero">


                <!-- BRAND -->

                <div class="brand">

                    <h1>
                        GABOBARS
                    </h1>

                    <span
                        class="brand-line"
                    ></span>

                </div>



                <!-- LANGUAGE -->

                <div class="language-toggle-wrap">

                    <button
                        class="language-toggle"
                        id="languageToggle"
                        type="button"
                        aria-label="Switch language"
                    >

                        <span
                            class="toggle-option"
                            data-lang="pt"
                        >
                            PT
                        </span>


                        <span
                            class="toggle-option"
                            data-lang="en"
                        >
                            ENG
                        </span>


                        <span
                            class="toggle-indicator"
                        ></span>

                    </button>

                </div>



                <!-- AVATAR + RANDOM TEXT -->

                <div class="hero-center">

                    <img
                        class="avatar"
                        src="assets/images/avatar.png"
                        alt="GABOBARS avatar"
                    >


                    <p
                        class="hero-rotating"
                        id="heroRotatingText"
                    ></p>

                </div>

            </header>



            <!-- =================================================
                 CONTENT
            ================================================== -->

            <div class="content">


                <!-- =================================================
                     ABOUT ME
                ================================================== -->

                <section
                    class="content-section about-section"
                >

                    <h2
                        class="section-title"
                        data-i18n="aboutTitle"
                    >
                        About Me
                    </h2>


                    <span
                        class="section-line"
                    ></span>


                    <p
                        class="about-copy"
                        id="aboutCopy"
                    ></p>

                </section>



                <!-- =================================================
                     SOCIAL LINKS
                ================================================== -->

                <section
                    class="content-section social-section"
                >

                    <nav
                        class="social-links"
                        aria-label="Social links"
                    >


                        <a
                            href="YOUR_TWITCH_LINK"
                            target="_blank"
                            rel="noopener noreferrer"
                        >
                            TWITCH
                        </a>


                        <span
                            class="social-divider"
                        ></span>


                        <a
                            href="YOUR_YOUTUBE_LINK"
                            target="_blank"
                            rel="noopener noreferrer"
                        >
                            YOUTUBE
                        </a>


                        <span
                            class="social-divider"
                        ></span>


                        <a
                            href="YOUR_DISCORD_LINK"
                            target="_blank"
                            rel="noopener noreferrer"
                        >
                            DISCORD
                        </a>


                        <span
                            class="social-divider"
                        ></span>


                        <a
                            href="YOUR_GITHUB_LINK"
                            target="_blank"
                            rel="noopener noreferrer"
                        >
                            GITHUB
                        </a>


                        <span
                            class="social-divider"
                        ></span>


                        <a
                            href="YOUR_STEAM_LINK"
                            target="_blank"
                            rel="noopener noreferrer"
                        >
                            STEAM
                        </a>


                        <span
                            class="social-divider"
                        ></span>


                        <a
                            href="YOUR_ITCH_LINK"
                            target="_blank"
                            rel="noopener noreferrer"
                        >
                            ITCH.IO
                        </a>

                    </nav>

                </section>



                <!-- =================================================
                     CURRENT INTERESTS
                ================================================== -->

                <section
                    class="content-section interests-section"
                >

                    <h2
                        class="section-title"
                        data-i18n="interestsTitle"
                    >
                        Current Interests
                    </h2>


                    <span
                        class="section-line"
                    ></span>


                    <div class="interest-grid">


                        <!-- First group -->


                        <a
                            class="interest-button"
                            href="https://ghost-official.com/"
                            target="_blank"
                            rel="noopener noreferrer"
                        >
                            GHOST
                        </a>


                        <a
                            class="interest-button"
                            href="CURRENT_OUTLAST_LINK"
                            target="_blank"
                            rel="noopener noreferrer"
                        >
                            OUTLAST
                        </a>


                        <a
                            class="interest-button"
                            href="https://www.residentevil.com/"
                            target="_blank"
                            rel="noopener noreferrer"
                        >
                            RESIDENT EVIL
                        </a>


                        <a
                            class="interest-button"
                            href="https://joeydrewstudios.com/"
                            target="_blank"
                            rel="noopener noreferrer"
                        >
                            BENDY
                        </a>


                        <a
                            class="interest-button"
                            href="https://unknownworlds.com/subnautica/"
                            target="_blank"
                            rel="noopener noreferrer"
                        >
                            SUBNAUTICA
                        </a>


                        <a
                            class="interest-button"
                            href="https://date-a-live-anime.com/"
                            target="_blank"
                            rel="noopener noreferrer"
                        >
                            DATE A LIVE
                        </a>


                        <!-- Group separator -->

                        <span
                            class="interest-group-gap"
                        ></span>


                        <!-- Second group -->


                        <a
                            class="interest-button"
                            href="https://freddy-fazbears-pizza.fandom.com/wiki/Five_Nights_at_Freddy%27s"
                            target="_blank"
                            rel="noopener noreferrer"
                        >
                            FNAF
                        </a>


                        <a
                            class="interest-button"
                            href="https://www.blender.org/"
                            target="_blank"
                            rel="noopener noreferrer"
                        >
                            BLENDER
                        </a>


                        <a
                            class="interest-button"
                            href="YOUR_CIGA_LINK"
                            target="_blank"
                            rel="noopener noreferrer"
                        >
                            CIGA
                        </a>


                        <a
                            class="interest-button"
                            href="YOUR_STREAMING_LINK"
                            target="_blank"
                            rel="noopener noreferrer"
                        >
                            STREAMING
                        </a>


                        <a
                            class="interest-button"
                            href="YOUR_VIDEO_EDITING_LINK"
                            target="_blank"
                            rel="noopener noreferrer"
                            data-i18n="videoEditing"
                        >
                            EDITAR VÍDEOS
                        </a>


                        <a
                            class="interest-button"
                            href="https://slipknot1.com/"
                            target="_blank"
                            rel="noopener noreferrer"
                        >
                            SLIPKNOT
                        </a>

                    </div>

                </section>



                <!-- =================================================
                     FOOTER
                ================================================== -->

                <footer class="site-footer">

                    <div
                        class="footer-line"
                    ></div>


                    <div
                        class="footer-row"
                    >

                        <p
                            id="footerMessage"
                        ></p>


                        <p>
                            GABOBARS — 2026
                        </p>

                    </div>

                </footer>

            </div>

        </section>

    </main>



    <!-- =====================================================
         MUSIC PLAYER
    ====================================================== -->

    <aside
        class="music-player"
        id="musicPlayer"
    >

        <div class="player-main">

            <div class="player-label">
                original track
            </div>


            <div class="player-controls-row">


                <button
                    class="play-button"
                    id="playButton"
                    type="button"
                    aria-label="Play"
                >
                    ▶
                </button>


                <input
                    class="progress-range"
                    id="progressRange"
                    type="range"
                    min="0"
                    max="100"
                    value="0"
                    step="0.1"
                    aria-label="Track progress"
                >


                <span
                    class="time-current"
                    id="timeCurrent"
                >
                    0:00
                </span>


                <button
                    class="volume-button"
                    id="volumeButton"
                    type="button"
                    aria-label="Volume"
                >
                    🔊
                </button>

            </div>

        </div>


        <div
            class="volume-popover"
            id="volumePopover"
        >

            <input
                id="volumeRange"
                type="range"
                min="0"
                max="1"
                value="0.1"
                step="0.01"
                aria-label="Volume"
            >

        </div>

    </aside>



    <!-- =====================================================
         AUDIO
    ====================================================== -->

    <audio
        id="audio"
        preload="metadata"
        src="assets/audio/original-track.mp3"
    ></audio>



    <!-- =====================================================
         TENOR
    ====================================================== -->

    <script
        type="text/javascript"
        async
        src="https://tenor.com/embed.js"
    ></script>



    <!-- =====================================================
         JAVASCRIPT
    ====================================================== -->

    <script
        src="script.js"
    ></script>

</body>

</html>
